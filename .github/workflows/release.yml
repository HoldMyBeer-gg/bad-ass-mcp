name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ── Per-platform PyInstaller bundles ─────────────────────────────────
  bundle:
    strategy:
      matrix:
        include:
          - os: macos-latest
            extra: macos
            name: macos
            hidden: bad_ass_mcp.backend.macos
          - os: windows-latest
            extra: windows
            name: windows
            hidden: bad_ass_mcp.backend.windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # needed for hatch-vcs tag resolution

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # emSign/eMudhra CA incident (Oct 2026): old pip trusts the pulled
      # roots via its vendored certifi, so upgrade before installing anything.
      - name: Upgrade pip + certifi
        run: python -m pip install -U "pip>=26.2.2" "certifi>=2026.10.19"

      - name: Install
        run: pip install pyinstaller ".[${{ matrix.extra }}]"

      - name: Build standalone
        shell: bash
        run: |
          pyinstaller \
            --onedir \
            --name bad-ass-mcp \
            --collect-all anyio \
            --collect-data bad_ass_mcp \
            --collect-data jsonschema_specifications \
            --hidden-import ${{ matrix.hidden }} \
            scripts/bundle_entry.py

      - name: Zip (Unix)
        if: runner.os != 'Windows'
        run: cd dist && zip -r ../bad-ass-mcp-${{ matrix.name }}.zip bad-ass-mcp/

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/bad-ass-mcp -DestinationPath bad-ass-mcp-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.name }}
          path: bad-ass-mcp-${{ matrix.name }}.zip

  # ── Publish sdist + wheel + bundles to GitHub Release ────────────────
  release:
    needs: bundle
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Upgrade pip + certifi
        run: python -m pip install -U "pip>=26.2.2" "certifi>=2026.10.19"

      - name: Build sdist + wheel
        run: pip install hatch hatch-vcs && hatch build

      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          path: bundles
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            bundles/*.zip

  # ── Publish sdist + wheel to PyPI (trusted publishing, no token) ─────
  pypi:
    needs: release
    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

  # ── Publish to the official MCP Registry (GitHub OIDC, no token) ──────
  # OIDC grants io.github.HoldMyBeer-gg/* (case-sensitive: the org as GitHub
  # spells it). Ownership of the PyPI package is proven by the mcp-name line
  # in README.md, which PyPI shows as the description, so this runs after
  # the PyPI upload.
  registry:
    needs: pypi
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1

    steps:
      - uses: actions/checkout@v7

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Set version from the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          jq --arg v "$v" '.version = $v | .packages[0].version = $v' server.json > s.json
          mv s.json server.json

      - name: Wait for PyPI to serve the release
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -fsS "https://pypi.org/pypi/bad-ass-mcp/$v/json" >/dev/null && exit 0
            sleep 10
          done
          echo "PyPI never showed $v" && exit 1

      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
